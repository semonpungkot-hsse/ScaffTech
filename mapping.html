        // Guaranteed Unique Scaffold ID Generator (Anti-Duplicate)
        const generateUniqueScaffoldId = (type = 'POINT', currentList = []) => {
            const prefix = type === 'LINEAR' ? 'SCF-LIN-26-' : 'SCF-26-';
            let maxNum = 0;
            (currentList || []).forEach(s => {
                if (!s || !s.id) return;
                const idStr = String(s.id).toUpperCase();
                if (idStr.startsWith(prefix)) {
                    const numPart = parseInt(idStr.replace(prefix, ''), 10);
                    if (!isNaN(numPart) && numPart > maxNum) maxNum = numPart;
                } else if (type === 'POINT' && idStr.startsWith('SCF-') && !idStr.startsWith('SCF-LIN-')) {
                    const rawNum = parseInt(idStr.replace('SCF-', ''), 10);
                    if (!isNaN(rawNum) && rawNum > maxNum) maxNum = rawNum;
                } else if (type === 'LINEAR' && idStr.startsWith('SCF-LIN-')) {
                    const rawNum = parseInt(idStr.replace('SCF-LIN-', ''), 10);
                    if (!isNaN(rawNum) && rawNum > maxNum) maxNum = rawNum;
                }
            });
            const nextNum = maxNum + 1;
            let candidate = `${prefix}${String(nextNum).padStart(4, '0')}`;
            let counter = 0;
            while ((currentList || []).some(s => s && s.id && s.id.toUpperCase() === candidate.toUpperCase()) && counter < 2000) {
                candidate = `${prefix}${String(nextNum + (++counter)).padStart(4, '0')}`;
            }
            return candidate;
        };

            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });

            const canvasRef = useRef(null);
            const imageRef = useRef(null);
            const fileInputRef = useRef(null);

            // Supabase Cloud Configuration States
            const [supabaseUrl, setSupabaseUrl] = useState(() => {
                return localStorage.getItem('svt_supabase_url_v5') || DEFAULT_SUPABASE_URL;
            });
            const [supabaseKey, setSupabaseKey] = useState(() => {
                return localStorage.getItem('svt_supabase_key_v5') || DEFAULT_SUPABASE_KEY;
            });
            const [supabaseStatus, setSupabaseStatus] = useState('CONNECTING');
            const [supabaseStatusMsg, setSupabaseStatusMsg] = useState('Connecting to Supabase Cloud...');
            const [showSupabaseModal, setShowSupabaseModal] = useState(false);
            const [autoCloudSync, setAutoCloudSync] = useState(() => {
                const saved = localStorage.getItem('svt_auto_cloud_sync_v5');
                return saved !== null ? saved === 'true' : true;
            });
            const [isSyncing, setIsSyncing] = useState(false);
            const [copiedSql, setCopiedSql] = useState(false);

            // =========================================================================
            // 2. SUPABASE CLIENT & MEMOIZED COMPUTED VALUES
            // =========================================================================
            const supabaseClient = useMemo(() => {
                if (!window.supabase) return null;
                const cleanUrl = (supabaseUrl || '').trim().replace(/\/+$/, '');
                const cleanKey = (supabaseKey || '').trim();
                if (!cleanUrl || !cleanKey || !cleanUrl.startsWith('http')) return null;
                try {
                    return window.supabase.createClient(cleanUrl, cleanKey);
                } catch (err) {
                    console.error('Supabase init error:', err);
                    return null;
                }
            }, [supabaseUrl, supabaseKey]);

            const activeLayersCount = useMemo(() => {
                return Object.values(displaySettings).filter(Boolean).length;
            }, [displaySettings]);

            const counts = useMemo(() => {
                const c = { ALL: scaffolds.length };
                Object.keys(STATUS_CONFIG).forEach(k => {
                    if (k !== 'ALL') {
                        c[k] = scaffolds.filter(s => s.status === k).length;
                    }
                });
                return c;
            }, [scaffolds]);

            const filteredScaffolds = useMemo(() => {
                return scaffolds.filter(s => {
                    const matchesFilter = activeFilter === 'ALL' ? true : s.status === activeFilter;
                    const q = searchQuery.toLowerCase().trim();
                    const matchesSearch = !q ||
                        s.id.toLowerCase().includes(q) ||
                        s.tagNumber.toLowerCase().includes(q) ||
                        s.location.toLowerCase().includes(q) ||
                        (s.inspector && s.inspector.toLowerCase().includes(q));
                    return matchesFilter && matchesSearch;
                });
            }, [scaffolds, activeFilter, searchQuery]);

            // =========================================================================
            // 3. LIFECYCLE & BACKGROUND CHECKS
            // =========================================================================
            // Auto evaluate HSE 7-day inspection expiry on mount
            useEffect(() => {
                let autoExpiredCount = 0;
                const updatedList = scaffolds.map(s => {
                    const { isExpired } = evaluateInspectionHealth(s);
                    if (isExpired && s.status === 'ACTIVE') {
                        autoExpiredCount++;
                        return { ...s, status: 'EXPIRED' };
                    }
                    return s;
                });

                if (autoExpiredCount > 0) {
                    setScaffolds(updatedList);
                    showNotification(`HSE Alert: ${autoExpiredCount} scaffolds automatically flagged EXPIRED (>7 days since inspection)!`, 'danger');
                }
            }, []);

            // Check URL search parameters on mount for deep linking from Database
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const q = params.get('search') || params.get('id') || params.get('scaffoldId');
                if (q) {
                    setSearchQuery(q);
                    const found = scaffolds.find(s => s.id.toLowerCase() === q.toLowerCase());
                    if (found) {
                        setSelectedScaffold(found);
                        setTimeout(() => handleFocusScaffold(found), 600);
                    }
                }
            }, [scaffolds]);

            // Camera QR Scanner lifecycle handler
            const handleQrCodeDetected = (scannedText) => {
                setShowScannerModal(false);
                let targetId = (scannedText || '').trim();
                if (targetId.includes('=')) {
                    const parts = targetId.split('=');
                    targetId = parts[parts.length - 1];
                }
                setSearchQuery(targetId);
                const matched = scaffolds.find(s => 
                    s.id.toLowerCase() === targetId.toLowerCase() || 
                    s.tagNumber.toLowerCase() === targetId.toLowerCase()
                );
                if (matched) {
                    handleFocusScaffold(matched);
                    showNotification(`Scafftag Verified! Focused on ${matched.id}`, 'success');
                } else {
                    showNotification(`Scanned tag "${targetId}" not found in current project!`, 'warning');
                }
            };

            useEffect(() => {
                let html5QrCode = null;
                if (showScannerModal && window.Html5Qrcode) {
                    const timeout = setTimeout(() => {
                        try {
                            html5QrCode = new window.Html5Qrcode("qr-camera-stream-map");
                            html5QrCode.start(
                                { facingMode: "environment" },
                                { fps: 10, qrbox: { width: 220, height: 220 } },
                                (decodedText) => {
                                    html5QrCode.stop().then(() => {
                                        handleQrCodeDetected(decodedText);
                                    }).catch(() => {
                                        handleQrCodeDetected(decodedText);
                                    });
                                },
                                () => {}
                            ).catch(err => {
                                console.warn("Camera start error (check permissions):", err);
                            });
                        } catch (err) {
                            console.warn("Scanner init exception:", err);
                        }
                    }, 300);

                    return () => {
                        clearTimeout(timeout);
                        if (html5QrCode && html5QrCode.isScanning) {
                            html5QrCode.stop().catch(() => {});
                        }
                    };
                }
            }, [showScannerModal]);

            // LocalStorage sync & Lucide icons instantiation
            useEffect(() => {
                localStorage.setItem('svt_scaffolds_v5_clean', JSON.stringify(scaffolds));
                localStorage.setItem('svt_display_settings_v5', JSON.stringify(displaySettings));
                localStorage.setItem('svt_auto_cloud_sync_v5', autoCloudSync ? 'true' : 'false');
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [scaffolds, displaySettings, activeFilter, selectedScaffold, isSidebarOpen, drawingMode, tempPathPoints, showLayerMenu, showSupabaseModal, supabaseStatus, autoCloudSync, qrModalScaffold, showScannerModal]);

            // Test and check Supabase connection
            const checkSupabaseConnection = async (client = supabaseClient, showSuccessToast = false) => {
                if (!client) {
                    setSupabaseStatus('UNCONFIGURED');
                    setSupabaseStatusMsg('Supabase Project URL not set');
                    if (showSuccessToast) showNotification('Please enter your Supabase Project URL first.', 'warning');
                    return false;
                }
                setSupabaseStatus('CONNECTING');
                setSupabaseStatusMsg('Connecting to Supabase Cloud...');
                try {
                    const { data, error } = await client.from('scaffolds').select('id').limit(1);
                    if (error) {
                        console.warn('Supabase query result error:', error);
                        if (error.code === '42P01' || error.code === 'PGRST205' || error.message?.toLowerCase().includes('does not exist') || error.message?.toLowerCase().includes('scaffolds') || error.message?.toLowerCase().includes('schema cache')) {
                            setSupabaseStatus('TABLE_MISSING');
                            setSupabaseStatusMsg('Table "scaffolds" not found in database');
                            if (showSuccessToast) showNotification('Connected to Supabase! Table "scaffolds" not created yet. Please execute the SQL setup script.', 'warning');
                            return false;
                        }
                        setSupabaseStatus('ERROR');
                        setSupabaseStatusMsg(error.message || 'Connection failed');
                        if (showSuccessToast) showNotification(`Failed to connect to Supabase: ${error.message}`, 'danger');
                        return false;
                    }
                    setSupabaseStatus('CONNECTED');
                    setSupabaseStatusMsg('Connected & Realtime Ready');
                    if (showSuccessToast) showNotification('Supabase Cloud connection established!', 'success');
                    return true;
                } catch (e) {
                    setSupabaseStatus('ERROR');
                    setSupabaseStatusMsg(e.message || 'Connection failed');
                    if (showSuccessToast) showNotification(`Connection error: ${e.message}`, 'danger');
                    return false;
                }
            };

            // Save Supabase Configuration
            const handleSaveSupabaseConfig = async (newUrl, newKey) => {
                const trimmedUrl = newUrl.trim();
                const trimmedKey = newKey.trim();
                localStorage.setItem('svt_supabase_url_v5', trimmedUrl);
                localStorage.setItem('svt_supabase_key_v5', trimmedKey);
                setSupabaseUrl(trimmedUrl);
                setSupabaseKey(trimmedKey);

                if (!trimmedUrl || !trimmedKey) {
                    setSupabaseStatus('UNCONFIGURED');
                    setSupabaseStatusMsg('Project URL and Key required');
                    return;
                }

                const tempClient = window.supabase.createClient(trimmedUrl.replace(/\/+$/, ''), trimmedKey);
                const ok = await checkSupabaseConnection(tempClient, true);
                if (ok) {
                    handlePullFromCloud(tempClient);
                }
            };

            // Pull Scaffolds from Supabase Cloud
            const handlePullFromCloud = async (client = supabaseClient) => {
                const cl = client || supabaseClient;
                if (!cl) {
                    showNotification('Please configure Supabase Project URL first!', 'warning');
                    return;
                }
                setIsSyncing(true);
                try {
                    const { data, error } = await cl.from('scaffolds').select('*').order('created_at', { ascending: false });
                    if (error) throw error;
                    if (data) {
                        const mapped = data.map(fromDbRecord);
                        setScaffolds(mapped);
                        if (mapped.length > 0 && !selectedScaffold) {
                            setSelectedScaffold(mapped[0]);
                        }
                        showNotification(`Loaded ${mapped.length} scaffolds from Supabase Cloud!`, 'success');
                    }
                } catch (e) {
                    showNotification(`Failed to pull cloud data: ${e.message}`, 'danger');
                } finally {
                    setIsSyncing(false);
                }
            };

            // Push all local Scaffolds to Cloud
            const handlePushToCloud = async () => {
                if (!supabaseClient) {
                    showNotification('Please configure Supabase Project URL first!', 'warning');
                    return;
                }
                if (scaffolds.length === 0) {
                    showNotification('No local scaffold data to upload.', 'warning');
                    return;
                }
                setIsSyncing(true);
                try {
                    const records = scaffolds.map(toDbRecord);
                    const { error } = await supabaseClient.from('scaffolds').upsert(records, { onConflict: 'id' });
                    if (error) throw error;
                    showNotification(`Uploaded ${records.length} scaffolds to Supabase Cloud!`, 'success');
                } catch (e) {
                    showNotification(`Failed to upload to cloud: ${e.message}`, 'danger');
                } finally {
                    setIsSyncing(false);
                }
            };

            // Single item background upsert
            const syncUpsertScaffold = async (item) => {
                if (!supabaseClient || !autoCloudSync) return;
                try {
                    const rec = toDbRecord(item);
                    const { error } = await supabaseClient.from('scaffolds').upsert(rec, { onConflict: 'id' });
                    if (error) {
                        console.error('Cloud auto-upsert error:', error);
                        showNotification(`Cloud sync error: ${error.message}`, 'warning');
                    } else {
                        setSupabaseStatus('CONNECTED');
                        setSupabaseStatusMsg('Connected & Synced');
                    }
                } catch (e) {
                    console.error('Cloud auto-upsert exception:', e);
                }
            };

            // Single item background delete
            const syncDeleteScaffold = async (id) => {
                if (!supabaseClient || !autoCloudSync) return;
                try {
                    const { error } = await supabaseClient.from('scaffolds').delete().eq('id', id);
                    if (error) {
                        console.error('Cloud auto-delete error:', error);
                        showNotification(`Cloud delete error: ${error.message}`, 'warning');
                    }
                } catch (e) {
                    console.error('Cloud auto-delete exception:', e);
                }
            };

            // Batch upsert to Cloud
            const syncBatchUpsertScaffolds = async (items) => {
                if (!supabaseClient || !autoCloudSync) return;
                try {
                    const recs = items.map(toDbRecord);
                    const { error } = await supabaseClient.from('scaffolds').upsert(recs, { onConflict: 'id' });
                    if (error) {
                        console.error('Cloud batch upsert error:', error);
                        showNotification(`Cloud batch sync error: ${error.message}`, 'warning');
                    } else {
                        setSupabaseStatus('CONNECTED');
                    }
                } catch (e) {
                    console.error('Cloud batch upsert exception:', e);
                }
            };

            const handleCopySqlScript = () => {
                navigator.clipboard.writeText(SUPABASE_SQL_SETUP);
                setCopiedSql(true);
                showNotification('SQL setup script copied to clipboard!', 'success');
                setTimeout(() => setCopiedSql(false), 3000);
            };

            // Initial connection check on startup
            useEffect(() => {
                if (supabaseClient) {
                    checkSupabaseConnection(supabaseClient).then(connected => {
                        if (connected) {
                            supabaseClient.from('scaffolds').select('*').order('created_at', { ascending: false })
                                .then(({ data, error }) => {
                                    if (!error && data && data.length > 0) {
                                        const mapped = data.map(fromDbRecord);
                                        setScaffolds(mapped);
                                        if (!selectedScaffold) setSelectedScaffold(mapped[0]);
                                    }
                                });
                        }
                    });
                } else {
                    setSupabaseStatus('UNCONFIGURED');
                    setSupabaseStatusMsg('Supabase Project URL not set');
                }
            }, [supabaseClient]);

            // Supabase Realtime Subscription Listener
            useEffect(() => {
                if (!supabaseClient || supabaseStatus !== 'CONNECTED') return;

                const channel = supabaseClient
                    .channel('public_scaffolds_changes')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'scaffolds' }, (payload) => {
                        if (payload.eventType === 'INSERT') {
                            const newRec = fromDbRecord(payload.new);
                            setScaffolds(prev => {
                                if (prev.some(s => s.id === newRec.id)) return prev;
                                return [newRec, ...prev];
                            });
                        } else if (payload.eventType === 'UPDATE') {
                            const updatedRec = fromDbRecord(payload.new);
                            setScaffolds(prev => prev.map(s => s.id === updatedRec.id ? updatedRec : s));
                            setSelectedScaffold(prev => prev?.id === updatedRec.id ? updatedRec : prev);
                        } else if (payload.eventType === 'DELETE') {
                            const deletedId = payload.old?.id;
                            if (deletedId) {
                                setScaffolds(prev => prev.filter(s => s.id !== deletedId));
                                setSelectedScaffold(prev => prev?.id === deletedId ? null : prev);
                            }
                        }
                    })
                    .subscribe();

                return () => {
                    if (supabaseClient && channel) {
                        supabaseClient.removeChannel(channel);
                    }
                };
            }, [supabaseClient, supabaseStatus]);

            // =========================================================================
            // 4. USER INTERACTION HANDLERS (100% ENGLISH)
            // =========================================================================
            const showNotification = (message, type = 'info') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            const toggleSetting = (key) => {
                setDisplaySettings(prev => ({
                    ...prev,
                    [key]: !prev[key]
                }));
            };

            const handleClearAllData = async () => {
                if (window.confirm('Are you sure you want to clear all scaffold data? This cannot be undone.')) {
                    setScaffolds([]);
                    setSelectedScaffold(null);
                    setEditingScaffold(null);
                    setTempPathPoints([]);
                    setDrawingMode(null);
                    localStorage.removeItem('svt_scaffolds_v5_clean');
                    if (supabaseClient && autoCloudSync && supabaseStatus === 'CONNECTED') {
                        try {
                            await supabaseClient.from('scaffolds').delete().neq('id', '___NEVER___');
                        } catch (e) {
                            console.error('Cloud clear error:', e);
                        }
                    }
                    showNotification('All scaffold records cleared! Canvas is now blank.', 'success');
                }
            };

            const handleLoadDemoDataset = () => {
                const demoData = generateFullDemoDataset();
                setScaffolds(demoData);
                setSelectedScaffold(demoData[0]);
                syncBatchUpsertScaffolds(demoData);
                showNotification(`Loaded ${demoData.length} sample scaffolds for demonstration.`, 'info');
            };

            const applyPreset = (presetName) => {
                if (presetName === 'ALL_ON') {
                    setDisplaySettings({
                        showLandmarks: true,
                        showPointScaffolds: true,
                        showLinearScaffolds: true,
                        showPinLabels: true,
                        showAlertPulse: true,
                        showTooltips: true,
                        showCanvasGrid: true,
                        showTopFilterBar: true
                    });
                    showNotification('Full View: All layers and annotations active', 'info');
                } else if (presetName === 'CLEAN_ZEN') {
                    setDisplaySettings({
                        showLandmarks: false,
                        showPointScaffolds: true,
                        showLinearScaffolds: true,
                        showPinLabels: false,
                        showAlertPulse: false,
                        showTooltips: true,
                        showCanvasGrid: false,
                        showTopFilterBar: false
                    });
                    showNotification('Zen Mode: Distraction-free blueprint view', 'success');
                } else if (presetName === 'HSE_FOCUS') {
                    setDisplaySettings({
                        showLandmarks: true,
                        showPointScaffolds: true,
                        showLinearScaffolds: true,
                        showPinLabels: true,
                        showAlertPulse: true,
                        showTooltips: true,
                        showCanvasGrid: true,
                        showTopFilterBar: true
                    });
                    setActiveFilter('EXPIRED');
                    showNotification('HSE Focus: Filtering for expired and urgent inspection units', 'warning');
                }
            };

            const handleWheel = (e) => {
                e.preventDefault();
                const factor = e.deltaY < 0 ? 1.15 : 0.87;
                setZoom(prev => Math.min(Math.max(prev * factor, 0.4), 4.5));
            };

            const handleMouseDown = (e) => {
                if (drawingMode) return;
                setIsDragging(true);
                setDragStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
            };

            const handleMouseMove = (e) => {
                if (!isDragging) return;
                setPan({
                    x: e.clientX - dragStart.x,
                    y: e.clientY - dragStart.y
                });
            };

            const handleMouseUp = () => {
                setIsDragging(false);
            };

            const resetView = () => {
                setZoom(1);
                setPan({ x: 0, y: 0 });
                showNotification('Canvas zoom reset to 100%', 'info');
            };

            const fitToScreen = () => {
                setZoom(0.85);
                setPan({ x: 0, y: 0 });
            };

            const handleImageUpload = (e) => {
                const file = e.target.files?.[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        setMapImage(ev.target.result);
                        localStorage.setItem('svt_custom_map_image_v5', ev.target.result);
                        showNotification('Custom site plan uploaded successfully!', 'success');
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleResetDefaultMap = () => {
                setMapImage(DEFAULT_MAP_URL);
                localStorage.removeItem('svt_custom_map_image_v5');
                showNotification('Restored Greenfield official plan.', 'success');
            };

            const handleFocusLocation = (locId) => {
                if (!locId) return;
                const loc = MAP_RED_LOCATIONS.find(l => l.id === locId);
                if (!loc) return;

                const targetZoom = 2.4;
                setZoom(targetZoom);

                if (imageRef.current) {
                    const imgW = imageRef.current.offsetWidth || 1000;
                    const imgH = imageRef.current.offsetHeight || 650;
                    const targetX = (loc.x / 100) * imgW;
                    const targetY = (loc.y / 100) * imgH;

                    setPan({
                        x: (imgW / 2 - targetX) * targetZoom,
                        y: (imgH / 2 - targetY) * targetZoom
                    });
                }

                setFocusedLocation(loc);
                showNotification(`Jumped to landmark: ${loc.name} (${loc.type})`, 'info');
                setTimeout(() => {
                    setFocusedLocation(prev => (prev?.id === loc.id ? null : prev));
                }, 5000);
            };

            const handleCanvasClick = (e) => {
                if (!imageRef.current) return;

                const rect = imageRef.current.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;

                const percentX = parseFloat(((clickX / rect.width) * 100).toFixed(2));
                const percentY = parseFloat(((clickY / rect.height) * 100).toFixed(2));

                if (drawingMode === 'POINT') {
                    const newId = generateUniqueScaffoldId('POINT', scaffolds);
                    const numPart = newId.replace('SCF-26-', '').replace('SCF-', '');
                    const newScaffold = {
                        id: newId,
                        tagNumber: `TAG-GRN-${numPart}`,
                        location: 'Field Site Plan Area',
                        type: 'POINT',
                        status: 'BUILDING',
                        x: percentX,
                        y: percentY,
                        installDate: getFormattedDate(0),
                        lastInspection: getFormattedDate(0),
                        targetDismantleDate: getFormattedDate(14),
                        actualDismantleDate: '',
                        inspector: 'Field HSE Officer',
                        notes: 'Newly plotted single tower scaffold.',
                        structureType: 'Independent Tower',
                        heightMeters: '6m',
                        lengthMeters: '-'
                    };

                    setEditingScaffold(newScaffold);
                    setModalMode('NEW');
                    setShowModal(true);
                    setDrawingMode(null);
                    return;
                }

                if (drawingMode === 'LINEAR') {
                    const nextPoints = [...tempPathPoints, { x: percentX, y: percentY }];
                    setTempPathPoints(nextPoints);
                    showNotification(`Plotted node #${nextPoints.length} (${percentX}%, ${percentY}%)`, 'info');
                }
            };

            const handleFinishLinearDrawing = () => {
                if (tempPathPoints.length < 2) {
                    showNotification('Please click at least 2 points to draw a linear scaffold span!', 'warning');
                    return;
                }

                const newId = generateUniqueScaffoldId('LINEAR', scaffolds);
                const numPart = newId.replace('SCF-LIN-26-', '').replace('SCF-LIN-', '');
                let approxLength = 0;
                for (let i = 0; i < tempPathPoints.length - 1; i++) {
                    const dx = tempPathPoints[i + 1].x - tempPathPoints[i].x;
                    const dy = tempPathPoints[i + 1].y - tempPathPoints[i].y;
                    approxLength += Math.sqrt(dx * dx + dy * dy);
                }
                const estimatedMeters = Math.max(Math.round(approxLength * 2.5), 10);

                const newLinearScaffold = {
                    id: newId,
                    tagNumber: `TAG-SPAN-${numPart}`,
                    location: 'Pipeline Rack / Multi-Point Span',
                    type: 'LINEAR',
                    status: 'BUILDING',
                    points: tempPathPoints,
                    installDate: getFormattedDate(0),
                    lastInspection: getFormattedDate(0),
                    targetDismantleDate: getFormattedDate(21),
                    actualDismantleDate: '',
                    inspector: 'Field HSE Officer',
                    notes: `Linear route scaffold spanning ${tempPathPoints.length} nodes.`,
                    structureType: 'Pipe Rack Linear Scaffold',
                    heightMeters: '4.0m',
                    lengthMeters: `${estimatedMeters} meters`
                };

                setEditingScaffold(newLinearScaffold);
                setModalMode('NEW');
                setShowModal(true);
                setDrawingMode(null);
                setTempPathPoints([]);
            };

            const cancelDrawing = () => {
                setDrawingMode(null);
                setTempPathPoints([]);
                showNotification('Drawing cancelled', 'info');
            };

            const undoLastPoint = () => {
                if (tempPathPoints.length > 0) {
                    setTempPathPoints(prev => prev.slice(0, -1));
                }
            };

            const handlePassInspection = (scaffoldId) => {
                const today = getFormattedDate(0);
                let passedScaffold = null;
                const updated = scaffolds.map(item => {
                    if (item.id === scaffoldId) {
                        passedScaffold = {
                            ...item,
                            status: 'ACTIVE',
                            lastInspection: today
                        };
                        return passedScaffold;
                    }
                    return item;
                });

                setScaffolds(updated);
                if (selectedScaffold && selectedScaffold.id === scaffoldId) {
                    setSelectedScaffold(prev => ({
                        ...prev,
                        status: 'ACTIVE',
                        lastInspection: today
                    }));
                }
                if (passedScaffold) {
                    syncUpsertScaffold(passedScaffold);
                }
                showNotification(`Inspection PASSED! ${scaffoldId} verified ACTIVE for 7 days.`, 'success');
            };

            const formatExcelDate = (val) => {
                if (!val) return '';
                if (typeof val === 'number') {
                    const jsDate = new Date(Math.round((val - 25569) * 86400 * 1000));
                    return jsDate.toISOString().split('T')[0];
                }
                const str = String(val).trim();
                const parsed = new Date(str);
                return !isNaN(parsed.getTime()) ? parsed.toISOString().split('T')[0] : str;
            };

            const handleDownloadExcelTemplate = () => {
                try {
                    const templateRows = [
                        {
                            "Scaffold ID": "SCF-101",
                            "Tag Number": "TAG-GRN-001",
                            "Type (POINT / LINEAR)": "POINT",
                            "Location": "SUB 524",
                            "Status": "ACTIVE",
                            "Install Date": "2026-09-20",
                            "Last Inspection Date": "2026-09-24",
                            "Target Dismantle": "2026-10-15",
                            "Inspector": "Hendra Wijaya",
                            "Height (m)": "12m",
                            "Linear Span": "-",
                            "Coordinates (X,Y / Path)": "21.2, 12.5",
                            "Remarks": "Operational 4-tier tower at Substation area"
                        },
                        {
                            "Scaffold ID": "SCF-202",
                            "Tag Number": "TAG-SPAN-088",
                            "Type (POINT / LINEAR)": "LINEAR",
                            "Location": "UNIT 543 -> UNIT 544",
                            "Status": "ACTIVE",
                            "Install Date": "2026-09-18",
                            "Last Inspection Date": "2026-09-22",
                            "Target Dismantle": "2026-10-05",
                            "Inspector": "Ahmad Sudiro",
                            "Height (m)": "4.5m",

                    ];

                    const guideRows = [
                        { "Column Guide": "Type", "Description": "Enter 'POINT' (single tower) or 'LINEAR' (pipe rack / multi-point span)" },

                        { "Column Guide": "Coordinates", "Description": "For POINT: X, Y (e.g. 21.2, 12.5). For LINEAR: X1,Y1; X2,Y2; X3,Y3" },
                        { "Column Guide": "Auto-Fill Coordinates", "Description": "If Coordinates column is blank but Location matches a landmark name (e.g. 'CLINIC', 'SUB 524'), coordinates are auto-filled!" }
                    ];

                    const wb = XLSX.utils.book_new();
                    const wsTemplate = XLSX.utils.json_to_sheet(templateRows);
                    const wsGuide = XLSX.utils.json_to_sheet(guideRows);

                    wsTemplate['!cols'] = [
                        { wch: 16 }, { wch: 16 }, { wch: 14 }, { wch: 22 },
                        { wch: 12 }, { wch: 13 }, { wch: 18 }, { wch: 14 },
                        { wch: 18 }, { wch: 10 }, { wch: 16 }, { wch: 32 },
                        { wch: 36 }
                    ];
                    wsGuide['!cols'] = [{ wch: 22 }, { wch: 60 }];

                    XLSX.utils.book_append_sheet(wb, wsTemplate, "Template_Scaffolding");
                    XLSX.utils.book_append_sheet(wb, wsGuide, "Instructions");

                    XLSX.writeFile(wb, "ScaffTech_Import_Template.xlsx");
                    showNotification('Excel template downloaded successfully!', 'success');
                } catch (err) {
                    showNotification('Failed to generate Excel template: ' + err.message, 'danger');
                }
            };

            const handleExportExcelData = () => {
                if (scaffolds.length === 0) {
                    showNotification('No scaffold records to export to Excel', 'warning');
                    return;
                }
                try {
                    const exportRows = scaffolds.map(s => {
                        let coordStr = '';
                        if (s.type === 'LINEAR' && s.points?.length > 0) {
                            coordStr = s.points.map(p => `${p.x},${p.y}`).join('; ');
                        } else {
                            coordStr = `${s.x || 0}, ${s.y || 0}`;
                        }

                        return {
                            "Scaffold ID": s.id,
                            "Tag Number": s.tagNumber,
                            "Type (POINT / LINEAR)": s.type || 'POINT',
                            "Location": s.location,
                            "Status": s.status,
                            "Install Date": s.installDate || '',
                            "Last Inspection Date": s.lastInspection || '',
                            "Target Dismantle": s.targetDismantleDate || '',
                            "Inspector": s.inspector || '',
                            "Height (m)": s.heightMeters || '',
                            "Linear Span": s.lengthMeters || '',
                            "Coordinates (X,Y / Path)": coordStr,
                            "Remarks": s.notes || ''
                        };
                    });

                    const wb = XLSX.utils.book_new();
                    const ws = XLSX.utils.json_to_sheet(exportRows);
                    ws['!cols'] = [
                        { wch: 16 }, { wch: 16 }, { wch: 12 }, { wch: 24 },
                        { wch: 12 }, { wch: 13 }, { wch: 18 }, { wch: 14 },
                        { wch: 18 }, { wch: 10 }, { wch: 16 }, { wch: 32 },
                        { wch: 36 }
                    ];

                    XLSX.utils.book_append_sheet(wb, ws, "Scaffolds_Register");
                    XLSX.writeFile(wb, `ScaffTech_Register_${getFormattedDate(0)}.xlsx`);
                    showNotification(`Exported ${scaffolds.length} scaffolds to Excel!`, 'success');
                } catch (err) {
                    showNotification('Failed to export Excel: ' + err.message, 'danger');
                }
            };

            const handleExportJSON = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(scaffolds, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `ScaffTech_Backup_${getFormattedDate(0)}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                showNotification('JSON backup file downloaded successfully!', 'success');
            };

            const handleCopyExportText = () => {
                navigator.clipboard.writeText(JSON.stringify(scaffolds, null, 2));
                showNotification('JSON backup copied to clipboard!', 'success');
            };

            const handleImportFromText = (text) => {
                try {
                    const parsed = JSON.parse(text);
                    if (Array.isArray(parsed)) {
                        setScaffolds(parsed);
                        setSelectedScaffold(parsed[0] || null);
                        syncBatchUpsertScaffolds(parsed);
                        showNotification(`Imported ${parsed.length} scaffolds from JSON!`, 'success');
                    } else {
                        showNotification('Invalid JSON: Root must be an array of scaffolds', 'danger');
                    }
                } catch (e) {
                    showNotification('JSON parse error: ' + e.message, 'danger');
                }
            };

            // Handle Save Scaffold Modal (Fixes "tombol safe scaffold tidak bisa disimpan")
            const handleSaveScaffoldForm = (formData) => {
                let data = { ...formData };
                // Ensure coordinates exist for accurate mapping
                if (data.type === 'POINT' && (data.x === undefined || data.y === undefined || isNaN(data.x) || isNaN(data.y))) {
                    const matchedLoc = MAP_RED_LOCATIONS.find(l => data.location && data.location.includes(l.name));
                    if (matchedLoc) {
                        data.x = matchedLoc.x;
                        data.y = matchedLoc.y;
                    } else {
                        data.x = 21.2;
                        data.y = 12.5;
                    }
                } else if (data.type === 'LINEAR' && (!data.points || data.points.length < 2)) {
                    const parts = (data.location || '').split('->').map(s => s.trim());
                    const p1 = MAP_RED_LOCATIONS.find(l => parts[0] && parts[0].includes(l.name)) || { x: 34.2, y: 42.3 };
                    const p2 = MAP_RED_LOCATIONS.find(l => parts[1] && parts[1].includes(l.name)) || { x: 44.5, y: 42.1 };
                    data.points = [{ x: p1.x, y: p1.y }, { x: p2.x, y: p2.y }];
                }

                // Anti-Duplicate ID Check
                if (modalMode === 'NEW') {
                    const duplicate = scaffolds.find(s => s.id.toLowerCase() === (data.id || '').toLowerCase());
                    if (duplicate) {
                        showNotification(`Scaffold ID "${data.id}" already exists! Please use a unique number.`, 'danger');
                        return;
                    }
                } else if (modalMode === 'EDIT' && editingScaffold) {
                    const duplicate = scaffolds.find(s => s.id.toLowerCase() === (data.id || '').toLowerCase() && s.id !== editingScaffold.id);
                    if (duplicate) {
                        showNotification(`Cannot save: Scaffold ID "${data.id}" is already used by another unit!`, 'danger');
                        return;
                    }
                }

                let updatedList;
                if (modalMode === 'NEW') {
                    updatedList = [data, ...scaffolds];
                    showNotification(`Scaffold ${data.id} registered and saved successfully!`, 'success');
                } else {
                    updatedList = scaffolds.map(s => s.id === (editingScaffold ? editingScaffold.id : data.id) ? data : s);
                    showNotification(`Scaffold ${data.id} updated and saved successfully!`, 'success');
                }
                setScaffolds(updatedList);
                setSelectedScaffold(data);
                setShowModal(false);
                setEditingScaffold(null);

                // Cloud sync
                syncUpsertScaffold(data);
            };

            // Handle Delete Scaffold Record
            const handleDeleteScaffold = (id) => {
                if (!window.confirm(`Are you sure you want to delete scaffold ${id}? This action cannot be undone.`)) return;
                setScaffolds(prev => prev.filter(s => s.id !== id));
                if (selectedScaffold?.id === id) setSelectedScaffold(null);
                syncDeleteScaffold(id);
                showNotification(`Scaffold ${id} successfully deleted from local & cloud.`, 'info');
            };

            // Handle Excel Import (.xlsx, .xls)
            const handleImportExcelFile = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const rows = XLSX.utils.sheet_to_json(ws);
                        if (!rows || rows.length === 0) {
                            showNotification('The uploaded Excel sheet contains no records!', 'warning');
                            return;
                        }
                        const imported = rows.map((r, idx) => ({
                            id: String(r['Scaffold ID'] || r['id'] || generateUniqueScaffoldId(r['Type'] || 'POINT', scaffolds)),
                            tagNumber: String(r['Tag Number'] || r['tag_number'] || `TAG-${idx + 1}`),
                            location: String(r['Location'] || r['location'] || 'SUB 524'),
                            type: String(r['Type'] || r['type'] || 'POINT').toUpperCase() === 'LINEAR' ? 'LINEAR' : 'POINT',

                            y: r['Coordinate Y (%)'] !== undefined ? parseFloat(r['Coordinate Y (%)']) : 12.5,
                            points: r['Path Points (JSON)'] ? (typeof r['Path Points (JSON)'] === 'string' ? JSON.parse(r['Path Points (JSON)']) : r['Path Points (JSON)']) : null,

                            lastInspection: formatExcelDate(r['Last Inspection'] || r['last_inspection']),
                            targetDismantleDate: formatExcelDate(r['Target Dismantle'] || r['target_dismantle_date']),
                            actualDismantleDate: formatExcelDate(r['Actual Dismantle'] || r['actual_dismantle_date']),
                            inspector: String(r['HSE Inspector'] || r['inspector'] || ''),
                            notes: String(r['Notes & Remarks'] || r['notes'] || ''),
                            structureType: String(r['Structure Type'] || r['structure_type'] || 'Independent Tower'),
                            heightMeters: String(r['Height'] || r['height_meters'] || '6m'),
                            lengthMeters: String(r['Length'] || r['length_meters'] || '-')

                        setScaffolds(imported);
                        setSelectedScaffold(imported[0] || null);
                        syncBatchUpsertScaffolds(imported);
                        setShowDataModal(false);
                        showNotification(`Successfully imported ${imported.length} scaffolds from Excel!`, 'success');
                    } catch (err) {
                        showNotification('Failed to parse Excel file: ' + err.message, 'danger');
                    }
                };
                reader.readAsBinaryString(file);
            };

            const handleImportFile = (e) => {

                        y: (imgH / 2 - py) * targetZoom

                                <i data-lucide="table-2" className="w-5 h-5 group-hover:scale-110 transition"></i>
                            </a>

                                        title="Fetch latest scaffolds from Supabase Cloud"
                                    >
                                        <i data-lucide="download-cloud" className="w-4 h-4 text-brand-600"></i>
                                        <span>Pull from Cloud</span>
                                    </button>
                                </div>

                                {/* Collapsible SQL Setup Guide */}
                                <div className="border border-sky-100 rounded-xl overflow-hidden bg-slate-50 text-xs">
                                    <div className="p-3 bg-sky-50/70 border-b border-sky-100 flex items-center justify-between">
                                        <div className="flex items-center gap-2 font-bold text-slate-800">
                                            <i data-lucide="terminal" className="w-4 h-4 text-brand-600"></i>
                                            <span>Database DDL: Supabase SQL Setup (1-Click)</span>
                                        </div>
                                        <button
                                            onClick={handleCopySqlScript}
                                            className="px-2.5 py-1 rounded-lg bg-white border border-sky-200 hover:border-brand-400 text-brand-700 font-bold text-[11px] flex items-center gap-1 shadow-xs transition hover:bg-slate-50"
                                        >
                                            <i data-lucide={copiedSql ? "check" : "copy"} className="w-3.5 h-3.5"></i>
                                            <span>{copiedSql ? 'Copied!' : 'Copy SQL Script'}</span>
                                        </button>
                                    </div>
                                    <div className="p-3">
                                        <p className="text-[11px] text-slate-500 mb-2 leading-relaxed">
                                            Run this script once in <b>Supabase Dashboard</b> → <b>SQL Editor</b> → <b>New Query</b> → <b>Run</b> to create tables, RLS policies, and realtime publication:
                                        </p>
                                        <pre className="p-2.5 bg-slate-900 text-slate-200 rounded-lg font-mono text-[10px] overflow-x-auto max-h-36 leading-relaxed select-all">
                                            {SUPABASE_SQL_SETUP}
                                        </pre>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Printable Scafftag & QR Modal */}
                    {qrModalScaffold && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-200 animate-in fade-in zoom-in-95 duration-150">
                                {/* Scafftag Card (Target for @media print) */}
                                <div id="printable-scafftag" className="p-6 bg-white text-slate-800 border-4 border-slate-900 m-3 rounded-2xl">
                                    {/* Header Banner based on HSE status */}
                                    <div className={`p-3 rounded-xl text-center text-white font-extrabold uppercase tracking-wider text-xs mb-4 shadow-xs ${
                                        qrModalScaffold.status === 'ACTIVE' ? 'bg-emerald-600' :
                                        qrModalScaffold.status === 'BUILDING' ? 'bg-amber-500' :
                                        qrModalScaffold.status === 'EXPIRED' ? 'bg-rose-600' :
                                        'bg-slate-700'
                                    }`}>
                                        {qrModalScaffold.status === 'ACTIVE' ? '✓ SCAFFOLD SAFE FOR USE (GREEN TAG)' :
                                         qrModalScaffold.status === 'BUILDING' ? '⚠ CAUTION - UNDER ERECTION / MODIFICATION' :
                                         qrModalScaffold.status === 'EXPIRED' ? '⛔ DANGER - DO NOT USE SCAFFOLD' :
                                         'SCAFFOLD WORK STATUS: ' + qrModalScaffold.status}
                                    </div>

                                    <div className="flex items-center justify-between border-b pb-3 mb-3 border-slate-200">
                                        <div>
                                            <div className="text-[10px] uppercase tracking-widest text-slate-500 font-bold">ScaffTech Project Safety</div>
                                            <div className="text-xl font-black text-slate-900 font-mono tracking-tight">{qrModalScaffold.id}</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-[10px] uppercase tracking-widest text-slate-500 font-bold">Physical Tag No</div>
                                            <div className="text-sm font-bold text-brand-700 font-mono">{qrModalScaffold.tagNumber}</div>
                                        </div>
                                    </div>

                                    {/* QR Code Container */}
                                    <div className="flex flex-col items-center justify-center p-4 bg-slate-50 rounded-2xl border border-slate-200 my-3">
                                        <img 
                                            src={`https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(qrModalScaffold.id)}&color=0f172a&bgcolor=f8fafc`} 
                                            alt={`QR Code for ${qrModalScaffold.id}`}
                                            className="w-36 h-36 rounded-xl shadow-xs"
                                        />
                                        <div className="text-xs font-mono text-slate-700 mt-2 font-black tracking-wider">{qrModalScaffold.id}</div>
                                        <div className="text-[10px] text-slate-400">Scan via ScaffTech to verify inspection</div>
                                    </div>

                                    {/* Details Grid */}
                                    <div className="space-y-1.5 text-xs border-t pt-3 border-slate-200">
                                        <div className="flex justify-between"><span className="text-slate-500 font-medium">Location:</span> <span className="font-bold text-slate-900">{qrModalScaffold.location}</span></div>
                                        <div className="flex justify-between"><span className="text-slate-500 font-medium">Structure:</span> <span className="font-semibold text-slate-800">{qrModalScaffold.structureType || 'Tower'}</span></div>
                                        <div className="flex justify-between"><span className="text-slate-500 font-medium">Height / Length:</span> <span className="font-mono text-slate-800">{qrModalScaffold.heightMeters || '-'} / {qrModalScaffold.lengthMeters || '-'}</span></div>
                                        <div className="flex justify-between"><span className="text-slate-500 font-medium">Last Inspection:</span> <span className="font-bold text-slate-900 font-mono">{qrModalScaffold.lastInspection || '-'}</span></div>
                                        <div className="flex justify-between"><span className="text-slate-500 font-medium">HSE Inspector:</span> <span className="font-semibold text-slate-800">{qrModalScaffold.inspector || '-'}</span></div>
                                    </div>
                                </div>

                                {/* Modal Footer (Screen-only actions) */}
                                <div className="p-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between gap-3">
                                    <button
                                        onClick={() => {
                                            navigator.clipboard.writeText(qrModalScaffold.id);
                                            showNotification(`Scaffold ID "${qrModalScaffold.id}" copied to clipboard!`, 'info');
                                        }}
                                        className="px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-700 hover:bg-slate-100 transition flex items-center gap-1.5 shadow-xs"
                                    >
                                        <i data-lucide="copy" className="w-3.5 h-3.5"></i>
                                        <span>Copy ID</span>
                                    </button>
                                    <div className="flex items-center gap-2">
                                        <button
                                            onClick={() => setQrModalScaffold(null)}
                                            className="px-4 py-2 border border-slate-200 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100 transition"
                                        >
                                            Close
                                        </button>
                                        <button
                                            onClick={() => window.print()}
                                            className="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold shadow-md shadow-brand-500/25 transition flex items-center gap-1.5"
                                        >
                                            <i data-lucide="printer" className="w-4 h-4"></i>
                                            <span>Print Scafftag</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Camera QR Scanner Modal */}
                    {showScannerModal && (
                        <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-200 animate-in fade-in zoom-in-95 duration-150">
                                <div className="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                                    <div className="flex items-center gap-2 font-bold text-slate-800 text-sm">
                                        <i data-lucide="scan" className="w-4 h-4 text-brand-600"></i>
                                        <span>Scan Physical Scafftag QR</span>
                                    </div>
                                    <button
                                        onClick={() => setShowScannerModal(false)}
                                        className="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-200/50"
                                    >
                                        <i data-lucide="x" className="w-4 h-4"></i>
                                    </button>
                                </div>
                                <div className="p-4">
                                    <div id="qr-camera-stream-map" className="w-full aspect-square bg-slate-900 rounded-2xl overflow-hidden relative flex items-center justify-center">
                                        <div className="text-white text-xs text-center p-4">
                                            <div className="animate-pulse mb-2 font-bold">Camera scanner active...</div>
                                            <p className="text-[11px] text-slate-400">Point device camera at the physical Scafftag QR code</p>
                                        </div>
                                    </div>
                                    <div className="mt-3 text-center">
                                        <p className="text-[11px] text-slate-500 font-medium">Or type Scaffold ID directly:</p>
                                        <div className="flex items-center gap-2 mt-2">
                                            <input
                                                type="text"
                                                placeholder="e.g. SCF-26-0001"
                                                id="manual-scan-input-map"
                                                className="flex-1 px-3 py-2 border border-slate-200 rounded-xl text-xs font-mono outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20"
                                                onKeyDown={(e) => {
                                                    if (e.key === 'Enter' && e.target.value.trim()) {
                                                        handleQrCodeDetected(e.target.value.trim());
                                                    }
                                                }}
                                            />
                                            <button
                                                onClick={() => {
                                                    const val = document.getElementById('manual-scan-input-map')?.value?.trim();
                                                    if (val) handleQrCodeDetected(val);
                                                }}
                                                className="px-4 py-2 bg-brand-600 text-white rounded-xl text-xs font-bold hover:bg-brand-700 shadow-xs"
                                            >
                                                Lookup
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toast Alerts */}
                    {toast && (
                        <div className={`fixed bottom-6 right-6 z-50 px-4 py-3 rounded-2xl shadow-xl border flex items-center gap-3 animate-in slide-in-from-bottom duration-200 ${toast.type === 'success'
                                ? 'bg-emerald-600 border-emerald-500 text-white'
                                : toast.type === 'warning'
                                    ? 'bg-amber-500 border-amber-400 text-white'
                                    : toast.type === 'danger'
                                        ? 'bg-rose-600 border-rose-500 text-white'
                                        : 'bg-slate-900 border-slate-800 text-white'
                            }`}>
                            <i data-lucide={toast.type === 'success' ? 'check-circle' : toast.type === 'danger' ? 'alert-octagon' : toast.type === 'warning' ? 'alert-triangle' : 'info'} className="w-5 h-5 shrink-0"></i>
                            <span className="text-xs font-semibold leading-relaxed">{toast.message}</span>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
