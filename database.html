    <script type="text/babel">

        // Greenfield Traffic Route Plan direct image
        const DEFAULT_MAP_URL = "https://qiumbpyltaclwjrfhslu.supabase.co/storage/v1/object/public/Attach/Green%20Field-%20Traffic%20Route%20Plan%20fix.png";

        // Supabase Default Credentials
        const DEFAULT_SUPABASE_URL = 'https://zlstjvxirzxaghbcmbod.supabase.co';
        const DEFAULT_SUPABASE_KEY = 'sb_publishable_6ROp0xv_X1sMtNGGaLsrsg_bPfe_xtA';

        // Landmark references for quick area selection and accurate coordinate mapping
        const MAP_RED_LOCATIONS = [
            { id: 'SUB_524', name: 'SUB 524', x: 21.2, y: 12.5, area: 'North Yard', type: 'Substation' },

            { id: 'UNIT_543', name: 'UNIT 543', x: 34.2, y: 42.3, area: 'Process Train 2', type: 'Unit Area' },

            { id: 'UNIT_537', name: 'UNIT 537', x: 60.2, y: 65.1, area: 'Fractionation Area', type: 'Unit Area' },
            { id: 'UNIT_566', name: 'UNIT 566', x: 72.1, y: 62.4, area: 'Compression Area', type: 'Unit Area' },
            { id: 'U_562', name: 'U-562', x: 80.3, y: 56.5, area: 'Boiler Area', type: 'Unit Area' },
            { id: 'U_567', name: 'U-567', x: 80.5, y: 66.2, area: 'Cooling Tower', type: 'Unit Area' },
            { id: 'UNIT_571', name: 'UNIT 571', x: 75.2, y: 78.3, area: 'Sulfur Plant', type: 'Unit Area' },
            { id: 'GATE_02', name: 'GATE -02', x: 5.4, y: 83.2, area: 'Southwest Gate', type: 'Gate' },
            { id: 'JV_AMBULANCE', name: 'JV AMBULANCE PARKING', x: 48.0, y: 86.4, area: 'Emergency Staging', type: 'Facility' },
            { id: 'SUB_522', name: 'SUB 522', x: 66.2, y: 89.1, area: 'South Grid', type: 'Substation' },
            { id: 'IES_514', name: 'IES-514', x: 78.4, y: 88.5, area: 'High Voltage yard', type: 'Substation' },
            { id: 'UNIT_500', name: 'UNIT 500', x: 18.2, y: 90.3, area: 'Offsite Receiving', type: 'Unit Area' },
            { id: 'UNIT_518_517_516', name: 'UNIT 518, 517, 516', x: 39.1, y: 91.0, area: 'Storage Tanks', type: 'Unit Area' },
            { id: 'GATE_03A', name: 'GATE-03A', x: 38.2, y: 96.8, area: 'South Access A', type: 'Gate' },
            { id: 'GATE_03', name: 'GATE -03', x: 81.3, y: 96.8, area: 'Main Heavy Transport', type: 'Gate' }
        ];

        // Status configurations
        const STATUS_MAP = {
            ACTIVE: { label: 'Active (Green Tag)', badge: 'bg-emerald-100 text-emerald-800 border-emerald-300', dot: 'bg-emerald-500' },
            BUILDING: { label: 'Building (Erection)', badge: 'bg-amber-100 text-amber-800 border-amber-300', dot: 'bg-amber-500' },
            REQUESTED: { label: 'Requested (Permit)', badge: 'bg-sky-100 text-brand-800 border-sky-300', dot: 'bg-brand-500' },
            EXPIRED: { label: 'Expired (>7d)', badge: 'bg-rose-100 text-rose-800 border-rose-300', dot: 'bg-rose-600' },
            DISMANTLED: { label: 'Dismantled', badge: 'bg-slate-100 text-slate-700 border-slate-300', dot: 'bg-slate-400' }
        };

        const getDaysDifference = (dateString) => {
            if (!dateString) return 999;
            const pastDate = new Date(dateString);
            const today = new Date();
            pastDate.setHours(0, 0, 0, 0);
            today.setHours(0, 0, 0, 0);
            const diffTime = today - pastDate;
            return Math.floor(diffTime / (1000 * 60 * 60 * 24));
        };

        const getFormattedDate = (offsetDays = 0) => {
            const d = new Date(Date.now() + offsetDays * 86400000);
            return d.toISOString().split('T')[0];
        };

        const evaluateInspectionHealth = (scaffold) => {
            if (scaffold.status === 'DISMANTLED') {
                return { isExpired: false, isUrgent: false, daysPassed: 0, daysLeft: 0, healthLabel: 'Dismantled', tone: 'slate' };
            }
            const daysPassed = getDaysDifference(scaffold.lastInspection);
            const isExpired = scaffold.status === 'EXPIRED' || daysPassed > 7;
            const daysLeft = Math.max(7 - daysPassed, 0);
            const isUrgent = !isExpired && daysLeft <= 2;

            let healthLabel = `Inspected ${daysPassed}d ago (${daysLeft}d left)`;
            let tone = 'emerald';
            if (isExpired) {
                healthLabel = `EXPIRED (${daysPassed}d overdue)`;
                tone = 'rose';
            } else if (isUrgent) {
                healthLabel = `CRITICAL (${daysLeft}d remaining)`;
                tone = 'amber';
            }
            return { isExpired, isUrgent, daysPassed, daysLeft, healthLabel, tone };
        };

        // Data mappers (CamelCase UI <-> Snake_Case Supabase Postgres)
        const toDbRecord = (item) => ({
            id: item.id,
            tag_number: item.tagNumber || item.tag_number || item.id,
            location: item.location || '',
            type: item.type || 'POINT',
            status: item.status || 'ACTIVE',
            x: item.x !== undefined && item.x !== null ? item.x : null,
            y: item.y !== undefined && item.y !== null ? item.y : null,
            points: item.points || null,
            install_date: item.installDate || item.install_date || '',
            last_inspection: item.lastInspection || item.last_inspection || '',
            target_dismantle_date: item.targetDismantleDate || item.target_dismantle_date || '',
            actual_dismantle_date: item.actualDismantleDate || item.actual_dismantle_date || '',
            inspector: item.inspector || '',
            notes: item.notes || '',
            structure_type: item.structureType || item.structure_type || '',
            height_meters: item.heightMeters || item.height_meters || '',
            length_meters: item.lengthMeters || item.length_meters || '',
            updated_at: new Date().toISOString()
        });

        const fromDbRecord = (row) => ({
            id: row.id,
            tagNumber: row.tag_number || row.tagNumber || row.id,
            location: row.location || '',
            type: row.type || 'POINT',
            status: row.status || 'ACTIVE',
            x: row.x !== null && row.x !== undefined ? Number(row.x) : undefined,
            y: row.y !== null && row.y !== undefined ? Number(row.y) : undefined,
            points: Array.isArray(row.points) ? row.points : undefined,
            installDate: row.install_date || row.installDate || '',
            lastInspection: row.last_inspection || row.lastInspection || '',
            targetDismantleDate: row.target_dismantle_date || row.targetDismantleDate || '',
            actualDismantleDate: row.actual_dismantle_date || row.actualDismantleDate || '',
            inspector: row.inspector || '',
            notes: row.notes || '',
            structureType: row.structure_type || row.structureType || '',
            heightMeters: row.height_meters || row.heightMeters || '',
            lengthMeters: row.length_meters || row.lengthMeters || ''
        });

        // Guaranteed Unique Scaffold ID Generator (Anti-Duplicate)
        const generateUniqueScaffoldId = (type = 'POINT', currentList = []) => {
            const prefix = type === 'LINEAR' ? 'SCF-LIN-26-' : 'SCF-26-';
            let maxNum = 0;
            (currentList || []).forEach(s => {
                if (!s || !s.id) return;
                const idStr = String(s.id).toUpperCase();
                if (idStr.startsWith(prefix)) {
                    const numPart = parseInt(idStr.replace(prefix, ''), 10);
                    if (!isNaN(numPart) && numPart > maxNum) maxNum = numPart;
                } else if (type === 'POINT' && idStr.startsWith('SCF-') && !idStr.startsWith('SCF-LIN-')) {
                    const rawNum = parseInt(idStr.replace('SCF-', ''), 10);
                    if (!isNaN(rawNum) && rawNum > maxNum) maxNum = rawNum;
                } else if (type === 'LINEAR' && idStr.startsWith('SCF-LIN-')) {
                    const rawNum = parseInt(idStr.replace('SCF-LIN-', ''), 10);
                    if (!isNaN(rawNum) && rawNum > maxNum) maxNum = rawNum;
                }
            });
            const nextNum = maxNum + 1;
            let candidate = `${prefix}${String(nextNum).padStart(4, '0')}`;
            let counter = 0;
            while ((currentList || []).some(s => s && s.id && s.id.toUpperCase() === candidate.toUpperCase()) && counter < 2000) {
                candidate = `${prefix}${String(nextNum + (++counter)).padStart(4, '0')}`;
            }
            return candidate;
        };

        // Universal Excel Date Parser (handles serial numbers and string formats)
        const formatExcelDate = (val) => {
            if (!val) return '';
            if (typeof val === 'number') {
                const jsDate = new Date(Math.round((val - 25569) * 86400 * 1000));
                return !isNaN(jsDate.getTime()) ? jsDate.toISOString().split('T')[0] : '';
            }
            if (val instanceof Date) {
                return !isNaN(val.getTime()) ? val.toISOString().split('T')[0] : '';
            }
            const str = String(val).trim();
            const parsed = new Date(str);
            return !isNaN(parsed.getTime()) ? parsed.toISOString().split('T')[0] : str;
        };

        // Universal Excel/JSON Row Parser (guarantees schema compatibility & coordinate autocalibration)
        const parseImportedRow = (r, idx, currentList) => {
            let rawId = r['Scaffold ID'] || r['ID Scaffolding'] || r['id'] || r['ID'] || r['Tag ID'];
            const rawType = String(r['Type (POINT / LINEAR)'] || r['Type'] || r['Tipe'] || r['type'] || 'POINT').trim().toUpperCase();
            const type = rawType.includes('LIN') ? 'LINEAR' : 'POINT';
            
            let id = rawId ? String(rawId).trim() : generateUniqueScaffoldId(type, currentList);
            
            let tagNumber = String(r['Tag Number'] || r['tag_number'] || r['No Tag'] || r['Nomor Tag'] || `TAG-${id}`).trim();
            let location = String(r['Location'] || r['Lokasi'] || r['location'] || 'SUB 524').trim();
            
            let rawStatus = String(r['Status'] || r['Status HSE'] || r['HSE Status'] || r['status'] || 'ACTIVE').trim().toUpperCase();
            let status = 'ACTIVE';
            if (rawStatus.includes('BUILD') || rawStatus.includes('ERECT') || rawStatus.includes('PASANG')) status = 'BUILDING';
            else if (rawStatus.includes('EXP') || rawStatus.includes('DUE') || rawStatus.includes('HABIS') || rawStatus.includes('RED')) status = 'EXPIRED';
            else if (rawStatus.includes('REQ') || rawStatus.includes('MINTA')) status = 'REQUESTED';
            else if (rawStatus.includes('DISM') || rawStatus.includes('BONGKAR')) status = 'DISMANTLED';
            else status = 'ACTIVE';

            let structureType = String(r['Structure Type'] || r['structure_type'] || r['Tipe Struktur'] || (type === 'LINEAR' ? 'Pipe Rack Linear Scaffold' : 'Independent Tower')).trim();
            let heightMeters = String(r['Height (m)'] || r['Height'] || r['height_meters'] || r['Tinggi (m)'] || r['Tinggi'] || '6m').trim();
            let lengthMeters = String(r['Linear Span'] || r['Length'] || r['length_meters'] || r['Panjang (m)'] || r['Panjang'] || (type === 'LINEAR' ? '25 meters' : '-')).trim();

            let installDate = formatExcelDate(r['Install Date'] || r['install_date'] || r['Tgl Pemasangan'] || r['Tanggal Pasang']);
            let lastInspection = formatExcelDate(r['Last Inspection Date'] || r['Last Inspection'] || r['last_inspection'] || r['Tgl Inspeksi Terakhir'] || r['Tanggal Inspeksi']);
            let targetDismantleDate = formatExcelDate(r['Target Dismantle'] || r['target_dismantle_date'] || r['Target Bongkar']);
            let actualDismantleDate = formatExcelDate(r['Actual Dismantle'] || r['actual_dismantle_date'] || r['Aktual Bongkar']);

            let inspector = String(r['Inspector'] || r['HSE Inspector'] || r['inspector'] || r['Inspector HSE'] || r['Petugas'] || '').trim();
            let notes = String(r['Remarks'] || r['Notes & Remarks'] || r['notes'] || r['Catatan'] || r['Keterangan'] || '').trim();

            let x = undefined;
            let y = undefined;
            let points = null;

            const rawCoords = r['Coordinates (X,Y / Path)'] || r['Coordinates'] || r['Koordinat'];
            const rawPoints = r['Path Points (JSON)'] || r['points'];

            if (rawPoints) {
                try {
                    points = typeof rawPoints === 'string' ? JSON.parse(rawPoints) : rawPoints;
                } catch (e) {}
            }

            if (type === 'LINEAR') {
                if (!points || !Array.isArray(points) || points.length < 2) {
                    if (typeof rawCoords === 'string' && rawCoords.includes(';')) {
                        const parsedPts = rawCoords.split(';').map(ptStr => {
                            const [px, py] = ptStr.split(',').map(n => parseFloat(n.trim()));
                            return (!isNaN(px) && !isNaN(py)) ? { x: px, y: py } : null;
                        }).filter(Boolean);
                        if (parsedPts.length >= 2) points = parsedPts;
                    }
                }
                if (!points || points.length < 2) {
                    const parts = location.split('->').map(s => s.trim());
                    const p1 = MAP_RED_LOCATIONS.find(l => parts[0] && parts[0].includes(l.name)) || { x: 34.2, y: 42.3 };
                    const p2 = MAP_RED_LOCATIONS.find(l => parts[1] && parts[1].includes(l.name)) || { x: 44.5, y: 42.1 };
                    points = [{ x: p1.x, y: p1.y }, { x: p2.x, y: p2.y }];
                }
            } else {
                const rawX = r['Coordinate X (%)'] !== undefined ? r['Coordinate X (%)'] : r['x'];
                const rawY = r['Coordinate Y (%)'] !== undefined ? r['Coordinate Y (%)'] : r['y'];
                if (rawX !== undefined && rawY !== undefined && !isNaN(parseFloat(rawX)) && !isNaN(parseFloat(rawY))) {
                    x = parseFloat(parseFloat(rawX).toFixed(2));
                    y = parseFloat(parseFloat(rawY).toFixed(2));
                } else if (typeof rawCoords === 'string' && rawCoords.includes(',')) {
                    const [cx, cy] = rawCoords.split(',').map(n => parseFloat(n.trim()));
                    if (!isNaN(cx) && !isNaN(cy)) {
                        x = parseFloat(cx.toFixed(2));
                        y = parseFloat(cy.toFixed(2));
                    }
                }
                if (x === undefined || y === undefined) {
                    const matchedLoc = MAP_RED_LOCATIONS.find(l => location && location.includes(l.name));
                    if (matchedLoc) {
                        x = matchedLoc.x;
                        y = matchedLoc.y;
                    } else {
                        x = 21.2;
                        y = 12.5;
                    }
                }
            }

            return {
                id,
                tagNumber,
                location,
                type,
                status,
                x,
                y,
                points,
                installDate,
                lastInspection,
                targetDismantleDate,
                actualDismantleDate,
                inspector,
                notes,
                structureType,
                heightMeters,
                lengthMeters
            };
        };

        function App() {
            // Main Dataset
            const [scaffolds, setScaffolds] = useState(() => {
                try {
                    const saved = localStorage.getItem('svt_scaffolds_v5_clean');
                    return saved ? JSON.parse(saved) : [];
                } catch {
                    return [];
                }
            });

            // Supabase State
            const [supabaseStatus, setSupabaseStatus] = useState('CONNECTING');
            const [supabaseStatusMsg, setSupabaseStatusMsg] = useState('Connecting to Supabase...');
            const [isSyncing, setIsSyncing] = useState(false);

            // Filter & Search States
            const [statusFilter, setStatusFilter] = useState('ALL');
            const [searchQuery, setSearchQuery] = useState('');
            const [healthFilter, setHealthFilter] = useState('ALL'); // ALL, VALID, URGENT, EXPIRED
            const [typeFilter, setTypeFilter] = useState('ALL'); // ALL, POINT, LINEAR
            const [sortBy, setSortBy] = useState('lastInspection'); // id, tagNumber, lastInspection, installDate, status
            const [sortOrder, setSortOrder] = useState('asc'); // asc, desc

            // Selected & Editing Modals
            const [selectedScaffold, setSelectedScaffold] = useState(null);
            const [showModal, setShowModal] = useState(false);
            const [modalMode, setModalMode] = useState('NEW'); // NEW, EDIT
            const [editingScaffold, setEditingScaffold] = useState(null);
            const [toast, setToast] = useState(null);

            // QR Scafftag, Camera Scanner & Import Modals
            const [qrModalScaffold, setQrModalScaffold] = useState(null);
            const [showScannerModal, setShowScannerModal] = useState(false);
            const [showImportModal, setShowImportModal] = useState(false);
            const fileInputRef = useRef(null);

            // Pagination
            const [currentPage, setCurrentPage] = useState(1);
            const itemsPerPage = 12;

            const supabaseClient = useMemo(() => {
                if (!window.supabase) return null;
                try {
                    return window.supabase.createClient(DEFAULT_SUPABASE_URL, DEFAULT_SUPABASE_KEY);
                } catch (e) {
                    console.error('Supabase init error:', e);
                    return null;
                }
            }, []);

            const showNotification = (message, type = 'info') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            // Connect & fetch data from Supabase
            const fetchCloudData = async (silent = false) => {
                if (!supabaseClient) return;
                setIsSyncing(true);
                try {
                    const { data, error } = await supabaseClient.from('scaffolds').select('*').order('created_at', { ascending: false });
                    if (error) {
                        console.warn('Fetch error:', error);
                        if (error.code === '42P01' || error.code === 'PGRST205') {
                            setSupabaseStatus('TABLE_MISSING');
                            setSupabaseStatusMsg('Table "scaffolds" not found in Supabase database');
                        } else {
                            setSupabaseStatus('ERROR');
                            setSupabaseStatusMsg(error.message);
                        }
                    } else {
                        setSupabaseStatus('CONNECTED');
                        setSupabaseStatusMsg('Connected & Realtime Active');
                        if (data && data.length > 0) {
                            const mapped = data.map(fromDbRecord);
                            setScaffolds(mapped);
                            if (!silent) showNotification(`Loaded ${mapped.length} scaffolds from Supabase Cloud!`, 'success');
                        } else if (!silent) {
                            showNotification('Supabase database is empty. You may register new scaffolds now.', 'info');
                        }
                    }
                } catch (err) {
                    setSupabaseStatus('ERROR');
                    setSupabaseStatusMsg(err.message);
                } finally {
                    setIsSyncing(false);
                }
            };

            // Initial load & Supabase Realtime Listener
            useEffect(() => {
                fetchCloudData(true);

                if (!supabaseClient) return;
                const channel = supabaseClient
                    .channel('table_scaffolds_changes')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'scaffolds' }, (payload) => {
                        if (payload.eventType === 'INSERT') {
                            const item = fromDbRecord(payload.new);
                            setScaffolds(prev => prev.some(s => s.id === item.id) ? prev : [item, ...prev]);
                            showNotification(`New record synced: ${item.id} (${item.tagNumber})`, 'info');
                        } else if (payload.eventType === 'UPDATE') {
                            const item = fromDbRecord(payload.new);
                            setScaffolds(prev => prev.map(s => s.id === item.id ? item : s));
                            setSelectedScaffold(prev => prev?.id === item.id ? item : prev);
                        } else if (payload.eventType === 'DELETE') {
                            const id = payload.old?.id;
                            if (id) {
                                setScaffolds(prev => prev.filter(s => s.id !== id));
                                setSelectedScaffold(prev => prev?.id === id ? null : prev);
                            }
                        }
                    })
                    .subscribe();

                return () => {
                    supabaseClient.removeChannel(channel);
                };
            }, [supabaseClient]);

            // Check URL search parameters on mount
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const q = params.get('search') || params.get('id') || params.get('scaffoldId');
                if (q) {
                    setSearchQuery(q);
                    const found = scaffolds.find(s => s.id.toLowerCase() === q.toLowerCase());
                    if (found) {
                        setSelectedScaffold(found);
                    }
                }
            }, []);

            // Save to localStorage whenever scaffolds change
            useEffect(() => {
                localStorage.setItem('svt_scaffolds_v5_clean', JSON.stringify(scaffolds));
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [scaffolds, selectedScaffold, showModal, statusFilter, healthFilter, currentPage, qrModalScaffold, showScannerModal]);

            // Handle Camera QR Scanner lifecycle
            const handleQrCodeDetected = (scannedText) => {
                setShowScannerModal(false);
                let targetId = (scannedText || '').trim();
                if (targetId.includes('=')) {
                    const parts = targetId.split('=');
                    targetId = parts[parts.length - 1];
                }
                setSearchQuery(targetId);
                const matched = scaffolds.find(s => 
                    s.id.toLowerCase() === targetId.toLowerCase() || 
                    s.tagNumber.toLowerCase() === targetId.toLowerCase()
                );
                if (matched) {
                    setSelectedScaffold(matched);
                    showNotification(`Scafftag Verified! Found ${matched.id} (${matched.status})`, 'success');
                } else {
                    showNotification(`Scanned tag "${targetId}" not found in database.`, 'warning');
                }
            };

            useEffect(() => {
                let html5QrCode = null;
                if (showScannerModal && window.Html5Qrcode) {
                    const timeout = setTimeout(() => {
                        try {
                            html5QrCode = new window.Html5Qrcode("qr-camera-stream");
                            html5QrCode.start(
                                { facingMode: "environment" },
                                { fps: 10, qrbox: { width: 220, height: 220 } },
                                (decodedText) => {
                                    html5QrCode.stop().then(() => {
                                        handleQrCodeDetected(decodedText);
                                    }).catch(() => {
                                        handleQrCodeDetected(decodedText);
                                    });
                                },
                                () => {}
                            ).catch(err => {
                                console.warn("Camera start error (check camera permission):", err);
                            });
                        } catch (err) {
                            console.warn("Scanner init exception:", err);
                        }
                    }, 300);

                    return () => {
                        clearTimeout(timeout);
                        if (html5QrCode && html5QrCode.isScanning) {
                            html5QrCode.stop().catch(() => {});
                        }
                    };
                }
            }, [showScannerModal]);

            // HSE Quick Verification Action
            const handlePassInspection = async (scaffoldId) => {
                const today = getFormattedDate(0);
                const updatedList = scaffolds.map(s => {
                    if (s.id === scaffoldId) {
                        return { ...s, status: 'ACTIVE', lastInspection: today };
                    }
                    return s;
                });
                setScaffolds(updatedList);
                if (selectedScaffold?.id === scaffoldId) {
                    setSelectedScaffold(prev => ({ ...prev, status: 'ACTIVE', lastInspection: today }));
                }

                // Cloud update
                if (supabaseClient) {
                    try {
                        const target = updatedList.find(s => s.id === scaffoldId);
                        await supabaseClient.from('scaffolds').upsert(toDbRecord(target), { onConflict: 'id' });
                    } catch (e) {
                        console.error('Inspection cloud save error:', e);
                    }
                }
                showNotification(`Inspection APPROVED! ${scaffoldId} verified ACTIVE for 7 days.`, 'success');
            };

            // Quick Status Switch
            const handleQuickStatusChange = async (scaffoldId, newStatus) => {
                const updatedList = scaffolds.map(s => s.id === scaffoldId ? { ...s, status: newStatus } : s);
                setScaffolds(updatedList);
                if (selectedScaffold?.id === scaffoldId) {
                    setSelectedScaffold(prev => ({ ...prev, status: newStatus }));
                }

                if (supabaseClient) {
                    try {
                        const target = updatedList.find(s => s.id === scaffoldId);
                        await supabaseClient.from('scaffolds').upsert(toDbRecord(target), { onConflict: 'id' });
                    } catch (e) {
                        console.error('Quick status cloud update error:', e);
                    }
                }
                showNotification(`Status of ${scaffoldId} changed to ${newStatus}.`, 'info');
            };

            // Handle Save Modal (Create / Update)
            const handleSaveModal = async (formData) => {
                let data = { ...formData };
                // Ensure coordinates exist for accurate mapping
                if (data.type === 'POINT' && (data.x === undefined || data.y === undefined)) {
                    const matchedLoc = MAP_RED_LOCATIONS.find(l => data.location && data.location.includes(l.name));
                    if (matchedLoc) {
                        data.x = matchedLoc.x;
                        data.y = matchedLoc.y;
                    } else {
                        data.x = 21.2;
                        data.y = 12.5;
                    }
                } else if (data.type === 'LINEAR' && (!data.points || data.points.length < 2)) {
                    const parts = (data.location || '').split('->').map(s => s.trim());
                    const p1 = MAP_RED_LOCATIONS.find(l => parts[0] && parts[0].includes(l.name)) || { x: 34.2, y: 42.3 };
                    const p2 = MAP_RED_LOCATIONS.find(l => parts[1] && parts[1].includes(l.name)) || { x: 44.5, y: 42.1 };
                    data.points = [{ x: p1.x, y: p1.y }, { x: p2.x, y: p2.y }];
                }

                // Anti-Duplicate ID Check
                if (modalMode === 'NEW') {
                    const duplicate = scaffolds.find(s => s.id.toLowerCase() === (data.id || '').toLowerCase());
                    if (duplicate) {
                        showNotification(`Scaffold ID "${data.id}" already exists! Please use a unique number.`, 'danger');
                        return;
                    }
                } else if (modalMode === 'EDIT' && editingScaffold) {
                    const duplicate = scaffolds.find(s => s.id.toLowerCase() === (data.id || '').toLowerCase() && s.id !== editingScaffold.id);
                    if (duplicate) {
                        showNotification(`Cannot save: Scaffold ID "${data.id}" is already used by another unit!`, 'danger');
                        return;
                    }
                }

                let updatedList;
                if (modalMode === 'NEW') {
                    updatedList = [data, ...scaffolds];
                    showNotification(`Scaffold ${data.id} successfully registered!`, 'success');
                } else {
                    updatedList = scaffolds.map(s => s.id === (editingScaffold ? editingScaffold.id : data.id) ? data : s);
                    showNotification(`Record ${data.id} successfully updated!`, 'success');
                }
                setScaffolds(updatedList);
                setSelectedScaffold(data);
                setShowModal(false);
                setEditingScaffold(null);

                // Cloud sync
                if (supabaseClient) {
                    try {
                        const { error } = await supabaseClient.from('scaffolds').upsert(toDbRecord(data), { onConflict: 'id' });
                        if (error) {
                            console.error('Save cloud error:', error);
                            showNotification(`Saved locally, cloud note: ${error.message}`, 'warning');
                        } else {
                            setSupabaseStatus('CONNECTED');
                        }
                    } catch (e) {
                        console.error('Save cloud error:', e);
                    }
                }
            };

            const handleDelete = async (id) => {

                if (selectedScaffold?.id === id) setSelectedScaffold(null);

                if (supabaseClient) {
                    try {
                        await supabaseClient.from('scaffolds').delete().eq('id', id);

                        console.error('Delete cloud error:', e);

                    showNotification("Failed to generate template: " + e.message, "danger");

            // Comprehensive Export to Excel (100% Compatible with Database & Mapping)
            const handleExportExcel = () => {
                if (scaffolds.length === 0) {
                    showNotification('No scaffold data available to export!', 'warning');
                    return;

                const rows = filteredScaffolds.map(s => {
                    const health = evaluateInspectionHealth(s);
                    let coordStr = '';
                    if (s.type === 'LINEAR' && s.points?.length > 0) {
                        coordStr = s.points.map(p => `${p.x},${p.y}`).join('; ');
                    } else {
                        coordStr = `${s.x || 0}, ${s.y || 0}`;
                    }

                    return {
                        'Scaffold ID': s.id,
                        'Tag Number': s.tagNumber,
                        'Type': s.type || 'POINT',
                        'Location': s.location,
                        'Status': s.status,
                        'HSE Status': health.healthLabel,
                        'Structure Type': s.structureType || '',
                        'Height (m)': s.heightMeters || '',
                        'Linear Span': s.lengthMeters || '',

                        'Last Inspection Date': s.lastInspection || '',
                        'Target Dismantle': s.targetDismantleDate || '',

                        'Inspector': s.inspector || '',
                        'Coordinates (X,Y / Path)': coordStr,
                        'Remarks': s.notes || ''
                    };
                });
                const ws = XLSX.utils.json_to_sheet(rows);
                ws['!cols'] = [
                    { wch: 18 }, { wch: 16 }, { wch: 12 }, { wch: 24 },
                    { wch: 12 }, { wch: 20 }, { wch: 22 }, { wch: 12 },
                    { wch: 14 }, { wch: 14 }, { wch: 18 }, { wch: 16 },
                    { wch: 16 }, { wch: 22 }, { wch: 30 }, { wch: 35 }
                ];
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Scaffolding_Report");
                XLSX.writeFile(wb, `ScaffTech_Report_${getFormattedDate(0)}.xlsx`);
                showNotification(`Excel report (${rows.length} records) downloaded successfully!`, 'success');
            };

            // Handle Excel Import (.xlsx, .xls) with Automatic Cloud Sync & Coordinate Calibration
            const handleImportExcelFile = async (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const rawRows = XLSX.utils.sheet_to_json(ws);
                        if (!rawRows || rawRows.length === 0) {
                            showNotification('The uploaded Excel file contains no records!', 'warning');
                            return;
                        }

                        let currentWorkingList = [...scaffolds];
                        const parsedRecords = [];

                        rawRows.forEach((r, idx) => {
                            const parsed = parseImportedRow(r, idx, currentWorkingList);
                            if (!currentWorkingList.some(s => s.id.toLowerCase() === parsed.id.toLowerCase())) {
                                currentWorkingList.push(parsed);
                                parsedRecords.push(parsed);
                            } else {
                                const newUniqueId = generateUniqueScaffoldId(parsed.type, currentWorkingList);
                                parsed.id = newUniqueId;
                                currentWorkingList.push(parsed);
                                parsedRecords.push(parsed);
                            }
                        });

                        setScaffolds(currentWorkingList);
                        localStorage.setItem('svt_scaffolds_v5_clean', JSON.stringify(currentWorkingList));
                        setShowImportModal(false);

                        // Batch upsert to Supabase
                        if (supabaseClient) {
                            try {
                                const dbRecords = parsedRecords.map(toDbRecord);
                                const { error } = await supabaseClient.from('scaffolds').upsert(dbRecords, { onConflict: 'id' });
                                if (error) {
                                    console.warn('Import cloud sync warning:', error);
                                    showNotification(`Imported ${parsedRecords.length} scaffolds locally (Cloud: ${error.message})`, 'warning');
                                } else {
                                    showNotification(`Successfully imported ${parsedRecords.length} scaffolds & synced to Cloud DB!`, 'success');
                                }
                            } catch(err) {
                                showNotification(`Imported ${parsedRecords.length} scaffolds locally!`, 'success');
                            }
                        } else {
                            showNotification(`Successfully imported ${parsedRecords.length} scaffolds!`, 'success');
                        }
                    } catch (err) {
                        showNotification('Failed to read Excel file: ' + err.message, 'danger');
                    }
                };
                reader.readAsBinaryString(file);
                e.target.value = '';
            };

            // Computed Statistics
            const stats = useMemo(() => {
                let active = 0, building = 0, requested = 0, expired = 0, dismantled = 0, urgent = 0;
                scaffolds.forEach(s => {
                    const health = evaluateInspectionHealth(s);
                    if (s.status === 'ACTIVE') active++;
                    else if (s.status === 'BUILDING') building++;
                    else if (s.status === 'REQUESTED') requested++;
                    else if (s.status === 'DISMANTLED') dismantled++;

                    if (health.isExpired) expired++;
                    else if (health.isUrgent) urgent++;
                });
                return { total: scaffolds.length, active, building, requested, expired, dismantled, urgent };
            }, [scaffolds]);

            // Filtered & Sorted Scaffolds
            const filteredScaffolds = useMemo(() => {
                return scaffolds.filter(s => {
                    // Status filter
                    if (statusFilter !== 'ALL' && s.status !== statusFilter) return false;

                    // HSE Health filter
                    const health = evaluateInspectionHealth(s);
                    if (healthFilter === 'EXPIRED' && !health.isExpired) return false;
                    if (healthFilter === 'URGENT' && !health.isUrgent) return false;
                    if (healthFilter === 'VALID' && (health.isExpired || health.isUrgent)) return false;

                    // Type filter
                    if (typeFilter !== 'ALL' && s.type !== typeFilter) return false;

                    // Search query
                    if (searchQuery.trim()) {
                        const q = searchQuery.toLowerCase();
                        const match = 
                            s.id.toLowerCase().includes(q) ||
                            (s.tagNumber && s.tagNumber.toLowerCase().includes(q)) ||
                            (s.location && s.location.toLowerCase().includes(q)) ||
                            (s.inspector && s.inspector.toLowerCase().includes(q)) ||
                            (s.structureType && s.structureType.toLowerCase().includes(q)) ||
                            (s.notes && s.notes.toLowerCase().includes(q));
                        if (!match) return false;
                    }

                    return true;
                }).sort((a, b) => {
                    let valA = a[sortBy] || '';
                    let valB = b[sortBy] || '';
                    if (sortOrder === 'asc') return valA > valB ? 1 : -1;
                    return valA < valB ? 1 : -1;
                });
            }, [scaffolds, statusFilter, healthFilter, typeFilter, searchQuery, sortBy, sortOrder]);

            // Paginated items
            const totalPages = Math.ceil(filteredScaffolds.length / itemsPerPage) || 1;
            const paginatedItems = useMemo(() => {
                const start = (currentPage - 1) * itemsPerPage;
                return filteredScaffolds.slice(start, start + itemsPerPage);
            }, [filteredScaffolds, currentPage]);

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800">
                    {/* Top Navigation Bar */}
                    <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-sky-100 shadow-xs px-4 lg:px-8 py-3.5">
                        <div className="flex flex-wrap items-center justify-between gap-3 max-w-7xl mx-auto">
                            {/* Brand & Page Context */}
                            <div className="flex items-center gap-3">
                                <a 
                                    href="mapping.html" 
                                    className="px-3 py-2 rounded-xl text-brand-700 bg-sky-50 hover:bg-sky-100 border border-sky-200 transition flex items-center gap-1.5 text-xs font-bold shadow-2xs"
                                    title="Switch to Greenfield Visual Map (mapping.html)"
                                >
                                    <i data-lucide="map" className="w-4 h-4 text-brand-600"></i>
                                    <span>Visual Map (GIS)</span>
                                </a>
                                <div>
                                    <div className="flex items-center gap-2">
                                        <h1 className="font-extrabold text-base tracking-tight text-slate-900">
                                            Scaff<span className="text-brand-600">Tech</span> <span className="text-xs font-semibold text-slate-500 uppercase">Database</span>
                                        </h1>
                                        <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-brand-50 text-brand-700 border border-brand-200">
                                            Data Center & HSE
                                        </span>
                                    </div>
                                    <p className="text-xs text-slate-500 font-medium">ScaffTech Enterprise Database • Realtime HSE Compliance & Multi-User CRUD</p>
                                </div>
                            </div>

                            {/* Status Indicator & Main Actions */}
                            <div className="flex items-center gap-2.5">
                                {/* Supabase Live Status Badge */}
                                <div className={`flex items-center gap-2 px-3 py-1.5 rounded-xl border text-xs font-bold ${
                                    supabaseStatus === 'CONNECTED'
                                    ? 'bg-emerald-50 text-emerald-800 border-emerald-300'
                                    : supabaseStatus === 'TABLE_MISSING' || supabaseStatus === 'CONNECTING'
                                    ? 'bg-amber-50 text-amber-800 border-amber-300'
                                    : 'bg-rose-50 text-rose-800 border-rose-300'
                                }`}>
                                    <span className={`w-2 h-2 rounded-full ${
                                        supabaseStatus === 'CONNECTED' ? 'bg-emerald-500 animate-pulse-dot' :
                                        supabaseStatus === 'TABLE_MISSING' || supabaseStatus === 'CONNECTING' ? 'bg-amber-500' : 'bg-rose-500'
                                    }`}></span>
                                    <span className="hidden md:inline">{supabaseStatusMsg}</span>
                                    <span className="md:hidden">Supabase</span>
                                    <button 
                                        onClick={() => fetchCloudData()} 
                                        disabled={isSyncing}
                                        className="ml-1 text-slate-500 hover:text-brand-600 p-0.5"
                                        title="Reload from Supabase Cloud"
                                    >
                                        <i data-lucide="refresh-cw" className={`w-3.5 h-3.5 ${isSyncing ? 'animate-spin' : ''}`}></i>
                                    </button>
                                </div>

                                {/* Export Excel */}
                                <button
                                    onClick={handleExportExcel}

                                    title="Export Scaffold Table to Excel (.xlsx)"

                                    <i data-lucide="file-spreadsheet" className="w-4 h-4 text-emerald-600"></i>
                                    <span className="hidden sm:inline">Export Excel</span>

                                {/* Import Excel */}
                                <button
                                    onClick={() => setShowImportModal(true)}

                                    title="Import Scaffold Table from Excel (.xlsx)"
                                >
                                    <i data-lucide="upload" className="w-4 h-4 text-brand-600"></i>
                                    <span className="hidden sm:inline">Import Excel</span>
                                </button>

                                {/* Add New Scaffold Button */}

                                        setEditingScaffold({
                                            id: newId,
                                            tagNumber: `TAG-GRN-${numPart}`,
                                            location: 'SUB 524',
                                            type: 'POINT',
                                            status: 'BUILDING',
                                            x: 21.2,
                                            y: 12.5,
                                            installDate: getFormattedDate(0),
                                            lastInspection: getFormattedDate(0),
                                            targetDismantleDate: getFormattedDate(14),
                                            actualDismantleDate: '',

                                            notes: '',

                                            lengthMeters: '-'
                                        });
                                        setModalMode('NEW');
                                        setShowModal(true);
                                    }}
                                    className="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl transition shadow-md shadow-brand-500/20 text-xs flex items-center gap-1.5 font-bold"
                                >
                                    <i data-lucide="plus-circle" className="w-4 h-4"></i>
                                    <span>Add Scaffold</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-8 space-y-6">
                        {/* Executive KPI Stats Overview */}
                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                            <div className="bg-white p-3.5 rounded-2xl border border-sky-100 shadow-xs">
                                <div className="flex items-center justify-between text-slate-400 text-xs font-semibold mb-1">
                                    <span>Total Units</span>
                                    <i data-lucide="layers" className="w-4 h-4 text-brand-500"></i>
                                </div>
                                <div className="text-2xl font-black text-slate-900">{stats.total}</div>
                                <div className="text-[10px] text-slate-400 mt-0.5">All site installations</div>
                            </div>

                            <div className="bg-white p-3.5 rounded-2xl border border-emerald-100 shadow-xs">
                                <div className="flex items-center justify-between text-emerald-600 text-xs font-semibold mb-1">
                                    <span>Active (Green)</span>
                                    <i data-lucide="check-circle-2" className="w-4 h-4 text-emerald-500"></i>
                                </div>
                                <div className="text-2xl font-black text-emerald-700">{stats.active}</div>
                                <div className="text-[10px] text-emerald-600/70 mt-0.5">Safe for site work</div>
                            </div>

                            <div className="bg-white p-3.5 rounded-2xl border border-amber-100 shadow-xs">
                                <div className="flex items-center justify-between text-amber-600 text-xs font-semibold mb-1">
                                    <span>Building</span>
                                    <i data-lucide="hammer" className="w-4 h-4 text-amber-500"></i>
                                </div>
                                <div className="text-2xl font-black text-amber-700">{stats.building}</div>
                                <div className="text-[10px] text-amber-600/70 mt-0.5">Erection phase</div>

                                        className="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-200/50"
                                    >
                                        <i data-lucide="x" className="w-4 h-4"></i>
                                    </button>
                                </div>
                                <div className="p-6 space-y-5">
                                    {/* Step 1: Download Template */}
                                    <div className="p-4 rounded-2xl bg-sky-50/60 border border-sky-100 flex items-center justify-between">
                                        <div>
                                            <p className="text-xs font-bold text-slate-800">Need standard template?</p>
                                            <p className="text-[11px] text-slate-500">Download formatted Excel sheet with field instructions.</p>
                                        </div>
                                        <button
                                            onClick={handleDownloadExcelTemplate}
                                            className="px-3 py-1.5 bg-white hover:bg-sky-50 text-brand-700 border border-brand-200 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-2xs"
                                        >
                                            <i data-lucide="download" className="w-3.5 h-3.5"></i>
                                            <span>Template</span>
                                        </button>
                                    </div>

                                    {/* Step 2: Upload Dropzone */}
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-2">Upload Spreadsheet</label>
                                        <label className="flex flex-col items-center justify-center p-6 bg-slate-50 border-2 border-dashed border-slate-300 hover:border-brand-500 hover:bg-sky-50/30 rounded-2xl cursor-pointer transition group">
                                            <div className="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mb-2 group-hover:scale-110 transition shadow-2xs">
                                                <i data-lucide="upload-cloud" className="w-6 h-6"></i>
                                            </div>
                                            <p className="font-bold text-slate-800 text-xs">Click or drag & drop Excel file here</p>
                                            <p className="text-[11px] text-slate-400 mt-0.5">Supports .xlsx and .xls (Auto-calibrates Landmark coordinates)</p>
                                            <input
                                                type="file"
                                                accept=".xlsx, .xls"
                                                ref={fileInputRef}
                                                onChange={handleImportExcelFile}
                                                className="hidden"
                                            />
                                        </label>
                                    </div>

                                    <div className="p-3 bg-slate-50 rounded-xl text-[11px] text-slate-500 flex items-start gap-2">
                                        <i data-lucide="info" className="w-4 h-4 text-brand-600 shrink-0 mt-0.5"></i>
                                        <span>Import automatically performs anti-duplicate validation, autocalibrates spatial map coordinates, and syncs directly to the Supabase Cloud Database.</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toast Alert */}
                    {toast && (
                        <div className={`fixed bottom-6 right-6 z-50 px-4 py-3 rounded-2xl shadow-xl border flex items-center gap-3 animate-in slide-in-from-bottom duration-200 ${
                            toast.type === 'success' ? 'bg-emerald-600 border-emerald-500 text-white' :
                            toast.type === 'warning' ? 'bg-amber-500 border-amber-400 text-white' :
                            toast.type === 'danger' ? 'bg-rose-600 border-rose-500 text-white' :
                            'bg-slate-900 border-slate-800 text-white'
                        }`}>
                            <i data-lucide={toast.type === 'success' ? 'check-circle' : toast.type === 'danger' ? 'alert-octagon' : toast.type === 'warning' ? 'alert-triangle' : 'info'} className="w-5 h-5 shrink-0"></i>
                            <span className="text-xs font-semibold leading-relaxed">{toast.message}</span>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
